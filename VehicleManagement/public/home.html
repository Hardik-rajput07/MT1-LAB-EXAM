
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .profile, .form-section, .table-section {
            background: white;
            padding: 22px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000010;
        }

        .profile {
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-top: 7px;
        }

        label {
            font-weight: bold;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            color: white;
            background: #2563eb;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete {
            background: #dc2626;
            margin-left: 5px;
        }

        .edit {
            background: #16a34a;
        }

        .cancel {
            background: #64748b;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #172554;
            color: white;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #172554;
            color: white;
        }

        @media(max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Vehicle Management System</h1>
        <p>Manage Your Vehicles Easily</p>
    </header>

    <div class="container">

        <section class="profile">
            <h2>Welcome to Vehicle Management System</h2>
            <p>Name: Hardik Lodhi</p>
            <p>Class: ECE-A</p>
            <p>Roll No: 2503203100056</p>
        </section>

        <section class="form-section">

            <h2 id="formTitle">Add New Vehicle</h2>

            <form id="vehicleForm">

                <div class="form-grid">

                    <div>
                        <label>Vehicle Name</label>
                        <input type="text" id="vehicleName"
                            placeholder="Enter vehicle name" required>
                    </div>

                    <div>
                        <label>Vehicle Number</label>
                        <input type="text" id="vehicleNumber"
                            placeholder="Enter vehicle number" required>
                    </div>

                    <div>
                        <label>Vehicle Type</label>
                        <select id="type" required>
                            <option value="">Select Type</option>
                            <option value="SUV">SUV</option>
                            <option value="Sedan">Sedan</option>
                            <option value="Hatchback">Hatchback</option>
                            <option value="Bike">Bike</option>
                        </select>
                    </div>

                    <div>
                        <label>Vehicle Price (INR)</label>
                        <input type="number" id="price"
                            placeholder="Enter price" min="0" required>
                    </div>

                </div>

                <button type="submit" id="submitBtn">
                    Add Vehicle
                </button>

                <button type="button" class="cancel"
                    id="cancelBtn" hidden onclick="resetForm()">
                    Cancel
                </button>

            </form>

            <p class="message" id="message"></p>

        </section>

        <section class="table-section">

            <h2>Vehicle List</h2>

            <button onclick="loadVehicles()">
                Refresh Vehicles
            </button>

            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Number</th>
                            <th>Type</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="vehicleList">
                    </tbody>
                </table>

            </div>

        </section>

    </div>

    <footer>
        <p>Vehicle Management System | Hardik Lodhi | ECE-A</p>
    </footer>

    <script>

        const API = '/vehicles';

        let editingId = null;

        const form = document.getElementById('vehicleForm');

        // Display message
        function showMessage(message) {
            document.getElementById('message').textContent = message;
        }

        // GET - Load all vehicles
        async function loadVehicles() {

            try {
                const response = await fetch(API);

                if (!response.ok) {
                    throw new Error("Unable to load vehicles");
                }

                const vehicles = await response.json();

                const list = document.getElementById('vehicleList');

                list.innerHTML = '';

                vehicles.forEach(vehicle => {

                    const row = document.createElement('tr');

                    const values = [
                        vehicle.id,
                        vehicle.vehicleName,
                        vehicle.vehicleNumber,
                        vehicle.type,
                        '₹' + Number(vehicle.price).toLocaleString('en-IN')
                    ];

                    values.forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    const actionCell = document.createElement('td');

                    const editBtn = document.createElement('button');
                    editBtn.textContent = 'Edit';
                    editBtn.className = 'edit';
                    editBtn.onclick = () => editVehicle(vehicle.id);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.className = 'delete';
                    deleteBtn.onclick = () => deleteVehicle(vehicle.id);

                    actionCell.append(editBtn, deleteBtn);
                    row.appendChild(actionCell);

                    list.appendChild(row);
                });

            } catch (error) {
                showMessage(error.message);
            }
        }

        // POST and PUT
        form.addEventListener('submit', async function(event) {

            event.preventDefault();

            const vehicle = {
                vehicleName: document.getElementById('vehicleName').value.trim(),
                vehicleNumber: document.getElementById('vehicleNumber').value.trim(),
                type: document.getElementById('type').value,
                price: Number(document.getElementById('price').value)
            };

            try {

                const url = editingId
                    ? `${API}/${editingId}`
                    : API;

                const method = editingId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(vehicle)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'Operation failed');
                }

                showMessage(result.message);

                resetForm();
                await loadVehicles();

            } catch (error) {
                showMessage(error.message);
            }
        });

        // Edit vehicle
        async function editVehicle(id) {

            try {
                const response = await fetch(`${API}/${id}`);

                if (!response.ok) {
                    throw new Error("Vehicle not found");
                }

                const vehicle = await response.json();

                editingId = id;

                document.getElementById('vehicleName').value =
                    vehicle.vehicleName;

                document.getElementById('vehicleNumber').value =
                    vehicle.vehicleNumber;

                document.getElementById('type').value =
                    vehicle.type;

                document.getElementById('price').value =
                    vehicle.price;

                document.getElementById('formTitle').textContent =
                    'Update Vehicle';

                document.getElementById('submitBtn').textContent =
                    'Update Vehicle';

                document.getElementById('cancelBtn').hidden = false;

                showMessage('Editing vehicle ID: ' + id);

                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                showMessage(error.message);
            }
        }

        // DELETE vehicle
        async function deleteVehicle(id) {

            if (!confirm('Are you sure you want to delete this vehicle?')) {
                return;
            }

            try {

                const response = await fetch(`${API}/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message);
                }

                showMessage(result.message);

                if (editingId === id) {
                    resetForm();
                }

                await loadVehicles();

            } catch (error) {
                showMessage(error.message);
            }
        }

        // Reset form
        function resetForm() {

            form.reset();

            editingId = null;

            document.getElementById('formTitle').textContent =
                'Add New Vehicle';

            document.getElementById('submitBtn').textContent =
                'Add Vehicle';

            document.getElementById('cancelBtn').hidden = true;
        }

        // Load vehicles when page opens
        loadVehicles();

    </script>

</body>
</html>
